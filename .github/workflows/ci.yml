# Per-service CI entry point. Calls the reusable workflows in
# chrissbo/platform-golden-paths. We pin to @main during simulation
# bootstrap; Phase 2 will move to a SHA pin and turn on Renovate so
# updates surface as PRs (the supply-chain practice in
# research/cicd-toolchain/01-source-and-build.md).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    # Manual trigger — useful for re-running the post-merge supply-chain
    # job against an arbitrary commit without faking a merge.
  schedule:
    # Daily at 04:17 UTC. Off-peak; minute is non-zero on purpose so we
    # don't pile onto :00 with everyone else.
    - cron: '17 4 * * *'

# Cancel in-flight runs on the same ref when a new commit lands. This is the
# concurrency pattern from research/cicd-toolchain/pipeline-architecture.md.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # SARIF upload to Security tab from reusable workflows
  pull-requests: write     # PR-Agent posts review comments (Phase 1.5c)
  issues: write            # PR-Agent comment plumbing

jobs:
  fast-check:
    # Pipeline 1: <3 min budget. Runs on push + pull_request + merge_group.
    if: ${{ github.event_name != 'schedule' }}
    uses: chrissbo/platform-golden-paths/.github/workflows/ci-fast-check.yml@main
    with:
      go-version: "1.25.11"

  pr-gate:
    # Pipeline 2: <8 min budget. Runs on PR + merge queue.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: chrissbo/platform-golden-paths/.github/workflows/ci-pr-gate.yml@main
    with:
      go-version: "1.25.11"
      run-iac: false   # no terraform/k8s manifests in this repo yet
      run-pact: false  # contract tests added in Phase 2

  ai-review:
    # Phase 1.5c: Mode 2 review bot. The reusable workflow itself decides
    # whether to actually run PR-Agent based on ANTHROPIC_API_KEY presence —
    # the 'secrets' context is not available in caller-side if: expressions,
    # so we only gate on the event type here.
    if: ${{ github.event_name == 'pull_request' }}
    uses: chrissbo/platform-golden-paths/.github/workflows/ci-pr-review.yml@main
    secrets: inherit

  monitor:
    # Pipeline 6 (Continuous, thin slice): refresh the Security tab on
    # push-to-main and on the daily schedule so main-branch state always
    # reflects the current CVE feed. Not a gate; never fails the workflow.
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: chrissbo/platform-golden-paths/.github/workflows/ci-monitor.yml@main
    with:
      go-version: "1.25.11"

  post-merge:
    # Pipeline 3 (Post-Merge supply chain): build + push to GHCR, generate
    # SBOMs, sign with Cosign keyless, attest. Runs on push-to-main and
    # workflow_dispatch (manual re-run, e.g. to re-attest an existing image).
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write          # ghcr push
      id-token: write          # Sigstore keyless
      attestations: write
      security-events: write
    uses: chrissbo/platform-golden-paths/.github/workflows/ci-post-merge.yml@main
    with:
      go-version: "1.25.11"
      image-name: ledger-service
      ko-main-package: ./cmd/ledger-service
      # Dependency-Track is local-only in the sim; toggle on by setting
      # DT_URL / DT_KEY in the local stack and patching this with values
      # exposed via a (cloudflared / tailscale) tunnel during a demo run.
      dependency-track-url: ""
      dependency-track-project-name: ledger-service
    secrets: inherit

  slsa-provenance:
    # SLSA L3 build provenance via the official trusted reusable workflow.
    # The workflow runs in an isolated GITHUB_TOKEN context where the
    # service repo cannot tamper with the signer — that's the L3 property.
    # We call it AFTER post-merge so the digest is known.
    needs: [post-merge]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write          # Sigstore keyless for the provenance attestation
      packages: write          # attach attestation to the GHCR image
      contents: read
      actions: read            # the generator reads workflow metadata
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ghcr.io/${{ github.repository_owner }}/ledger-service
      digest: ${{ needs.post-merge.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
