# Dependabot config for ledger-service.
# Opens PRs that bump Go modules and pinned GitHub Actions.
# Phase 1.5 of the local pipeline simulation — see
# research/cicd-toolchain/local-simulation-feasibility.md (parent thought-work).

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # Group minor + patch into one PR per week. Layer A auto-merges;
    # majors stay separate for human review.
    groups:
      go-modules-minor:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci-actions-minor:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
